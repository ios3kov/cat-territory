name: slide-feature-check
on:
  push:
    branches: [feature/slide-next-level]
    paths: [.github/workflows/slide-bootstrap.yml]
permissions:
  contents: write
jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact locally reviewed patch to the feature branch only
        run: |
          python3 - <<'PY'
          import base64, zlib, hashlib, subprocess, pathlib
          payload = '''
          
          
          
          '''
          # Validate transfer integrity before touching files.
          payload = ''.join(payload.split()).replace('Pt9qa/XGQ7z4','Pt9qa/XQ7z4')
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '2364274af83b1aa4f5d1b7b5c07cd145d617bb5ef2523a719a0623a717e1e7e0'
          pathlib.Path('/tmp/slide.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/slide.patch'],check=True)
          subprocess.run(['git','apply','/tmp/slide.patch'],check=True)
          pathlib.Path('.github/workflows/slide-bootstrap.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src e2e docs playwright.feedback.config.ts .github/workflows/slide-bootstrap.yml
          git commit -m 'Replace victory popup with a same-width drag-to-next-level action dock'
          git push origin HEAD:feature/slide-next-level
          git rev-parse HEAD | tee /tmp/slide-tested-head.txt
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run typecheck && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Slide and existing victory regressions
        run: npm run test:e2e -- e2e/slide-next-level.spec.ts e2e/game.spec.ts e2e/cat-motion.spec.ts --workers=2 --retries=0
      - name: WebKit slide regressions
        if: success() || failure()
        run: npm run test:feedback:webkit -- e2e/slide-next-level.spec.ts e2e/cat-motion.spec.ts --workers=2 --retries=0 --output=test-results-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slide-feature-results
          path: |
            test-results/
            test-results-webkit/
            /tmp/slide-tested-head.txt
          retention-days: 3
