name: verify
on:
  push:
    branches: [main, fix/local-ux-round2, fix/qa-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Debug format diff
        run: |
          npm run format
          git diff -- src/useGameController.ts e2e/haptics.spec.ts e2e/logic.spec.ts
          git diff --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run audit:prod
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:feedback:webkit
      - run: npm run test:offline
      - run: npm run profile:check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
