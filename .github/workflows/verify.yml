name: verify
on:
  push:
    branches: [main, fix/local-ux-round2]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/infiniteLevels.ts e2e/audit.spec.ts e2e/game.spec.ts e2e/helpers/generatedLevel.ts e2e/starter-free.spec.ts e2e-offline/offline.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            src/infiniteLevels.ts
            e2e/audit.spec.ts
            e2e/game.spec.ts
            e2e/helpers/generatedLevel.ts
            e2e/starter-free.spec.ts
            e2e-offline/offline.spec.ts
          retention-days: 1
      - run: exit 1
