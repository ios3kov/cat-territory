name: slide-feature-final
on:
  push:
    branches: [verify/slide-touch-timing]
permissions:
  contents: read
jobs:
  verify-slide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f832916e318db48ca23ed2ba092a7640dd4aa8e8
          persist-credentials: false
      - run: git rev-parse HEAD > slide-tested-head.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium desktop and mobile slide regressions
        run: npm run test:e2e -- e2e/slide-next-level.spec.ts e2e/cat-motion.spec.ts --retries=0 --trace=retain-on-failure
      - name: WebKit portrait and landscape slide regressions
        if: success() || failure()
        run: npm run test:feedback:webkit -- e2e/slide-next-level.spec.ts e2e/cat-motion.spec.ts --retries=0 --output=test-results-webkit --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slide-verified-screenshots
          path: |
            slide-tested-head.txt
            test-results/
            test-results-webkit/
          retention-days: 3
